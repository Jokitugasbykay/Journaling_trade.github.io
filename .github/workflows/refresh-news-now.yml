name: Refresh news now

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/refresh-news-now.yml'
      - 'scripts/fix_locales_complete.py'

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: publisher-news-emergency
  cancel-in-progress: true

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Fix locales
        run: python3 scripts/fix_locales_complete.py
      - name: Audit locales
        run: node scripts/audit-locales.cjs
      - name: Update feeds
        run: |
          python3 scripts/update_news.py
          python3 scripts/update_bi.py
          python3 scripts/update_macro.py || true
      - name: Build news bundles
        run: python3 scripts/build_news.py
      - name: Commit feed files
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add berita.json bi.json kalender.json fomc.json js/locales news/images || true
          # news/index etc generated by build_news — may be gitignored; still needed for pages artifact
          if ! git diff --cached --quiet; then
            git commit -m "Refresh publisher headlines and BI rates"
            git pull --rebase origin main || true
            git push origin HEAD:main
          fi
      - name: Prepare site artifact
        run: |
          mkdir -p _site/news
          cp index.html berita.json kalender.json bi.json fomc.json regional-sources.json _site/ 2>/dev/null || true
          cp services/pro_api/regions.json _site/news-regions.json 2>/dev/null || true
          cp -r css js _site/
          if [ -f news/index.json ]; then cp news/index.json _site/news/; fi
          for d in sources archive categories images; do
            if [ -d "news/$d" ]; then cp -r "news/$d" _site/news/; fi
          done
          for route in home journal statistics calculator economic-news economic-news/calendar login profile pro; do
            mkdir -p "_site/$route"
            cp index.html "_site/$route/index.html"
          done
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - uses: actions/deploy-pages@v4
