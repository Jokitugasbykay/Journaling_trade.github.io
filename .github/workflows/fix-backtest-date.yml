name: Fix backtest dates

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/fix-backtest-date.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Patch remaining iso reference
        run: |
          python3 -c '
          from pathlib import Path
          p = Path("js/pro.js")
          t = p.read_text()
          old = "if (!iso) return \"-\";"
          new = "if (ts === null || ts === undefined || ts === \"\") return \"-\";"
          if old not in t:
            print("already fixed or pattern missing")
          else:
            t = t.replace(old, new, 1)
            p.write_text(t)
            print("patched", p.stat().st_size)
          '

      - name: Commit
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add js/pro.js
          git diff --cached --quiet && exit 0
          git commit -m "fix(backtest): complete fmtTime null check"
          git push
