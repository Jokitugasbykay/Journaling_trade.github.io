name: Fix backtest dates

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/fix-backtest-date.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Fix undeclared iso
        run: |
          python3 << 'PY'
          from pathlib import Path
          p = Path('js/pro.js')
          t = p.read_text()
          t2 = t.replace('if (!iso) return \'-\';', 'if (ts == null || ts === \'\') return \'-\';')
          if t2 == t:
              # try double-quote variant from previous edits
              t2 = t.replace('if (!iso) return "-";', 'if (ts == null || ts === "") return "-";')
          if t2 == t:
              raise SystemExit('pattern not found')
          p.write_text(t2)
          print('fixed', p.stat().st_size)
          assert 'if (!iso)' not in t2
          PY

      - name: Commit
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add js/pro.js
          git commit -m "fix(backtest): remove undeclared iso in fmtTime"
          git push
