name: Audit fix core

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/audit-fix-core.yml'
      - 'scripts/audit_fix_core.py'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python3 scripts/audit_fix_core.py
      - name: Syntax check
        run: |
          node --check js/app.js
          node --check js/payment.js
          node --check js/pro.js
          node --check js/home.js
      - name: Cache bust
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          ver='20261025-auditcore'
          for path in list(Path('.').rglob('index.html'))+[Path('404.html')]:
            if not path.exists() or 'node_modules' in path.parts: continue
            t=path.read_text(encoding='utf-8')
            t2=re.sub(r'(js/(?:app|payment|pro|home)\.js)\?v=[^"\']+', lambda m: m.group(1)+'?v='+ver, t)
            t2=re.sub(r'(css/(?:home|style)\.css)\?v=[^"\']+', lambda m: m.group(1)+'?v='+ver, t2)
            if t2!=t:
              path.write_text(t2,encoding='utf-8'); print('bust',path)
          PY
      - name: Commit
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git diff --cached --quiet && exit 0
          git commit -m "fix: Midtrans auth, multilingual Kayla AI, news 60s, home layout"
          git push
