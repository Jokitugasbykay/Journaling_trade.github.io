name: Fix locales for news

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/fix-locales-news.yml'
      - 'scripts/fix_locales_and_refresh_news.py'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python3 scripts/fix_locales_and_refresh_news.py
      - run: node scripts/audit-locales.cjs
      - name: Commit
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git diff --cached --quiet && exit 0
          git commit -m "fix(i18n): add profileUploadPhoto/RemovePhoto keys (unblock news pipeline)"
          git push
