name: Audit min

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/audit-min.yml'

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch payment app home pro
        run: python3 scripts/audit_min.py
      - run: node --check js/app.js && node --check js/payment.js && node --check js/pro.js && node --check js/home.js
      - name: Bust
        run: |
          python3 -c "from pathlib import Path; import re; ver='20261025-amin';
[Path(p).write_text(re.sub(r'(js/(?:app|payment|pro|home)\\.js)\\?v=[^\"\\']+', lambda m: m.group(1)+'?v='+ver, Path(p).read_text()), encoding='utf-8') for p in list(map(str, Path('.').rglob('index.html')))+['404.html'] if Path(p).exists()]"
      - name: Commit
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git diff --cached --quiet && exit 0
          git commit -m "fix: payment Midtrans auth, news 60s, home layout, multilingual AI"
          git push
