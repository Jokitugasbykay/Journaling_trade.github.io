name: Force Pages redeploy

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/force-pages-redeploy.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  bump:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Ensure blues gone + bump CSS versions
        run: |
          set -e
          python3 << 'PY'
          from pathlib import Path
          import re

          replacements = [
            ('#38bdf8', '#f1f5f9'),
            ('#38BDF8', '#f1f5f9'),
            ('#7cb9ff', '#cbd5e1'),
            ('#7CB9FF', '#cbd5e1'),
            ('%2338bdf8', '%23f1f5f9'),
            ('%2338BDF8', '%23f1f5f9'),
            ('rgba(56, 189, 248,', 'rgba(241, 245, 249,'),
            ('rgba(56,189,248,', 'rgba(241,245,249,'),
            ('rgba(56, 189, 248,', 'rgba(241, 245, 249,'),
          ]

          for path in list(Path('css').rglob('*.css')):
            text = path.read_text(encoding='utf-8')
            orig = text
            for a, b in replacements:
              text = text.replace(a, b)
            # Global accent-color for form controls (helps some browsers)
            if path.name == 'style.css' and 'accent-color:' not in text[:800]:
              text = text.replace(
                ':root {',
                ':root {\n      accent-color: #f1f5f9;',
                1,
              )
            if text != orig:
              path.write_text(text, encoding='utf-8')
              print('patched', path)

          # Cache-bust stylesheet links in index.html
          idx = Path('index.html')
          html = idx.read_text(encoding='utf-8')
          html2 = re.sub(
            r'(css/(?:style|home|shell|pro|journal)\.css)\?v=[^"\']+',
            lambda m: m.group(1) + '?v=20261024-neutral-palette',
            html,
          )
          if html2 != html:
            idx.write_text(html2, encoding='utf-8')
            print('bumped index.html cache versions')

          left = 0
          for path in Path('css').rglob('*.css'):
            t = path.read_text(encoding='utf-8').lower()
            left += t.count('38bdf8') + t.count('56, 189, 248') + t.count('56,189,248') + t.count('7cb9ff')
          print('leftover blue tokens', left)
          PY

      - name: Commit and push
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git status
          git diff --cached --quiet && exit 0
          git commit -m "style: neutralize remaining sky-blue + cache-bust CSS v20261024"
          git push
