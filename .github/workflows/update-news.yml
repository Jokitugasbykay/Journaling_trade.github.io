name: Update publisher news
on:
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:
  push:
    branches: [main]
permissions:
  contents: write
  pages: write
  id-token: write
concurrency:
  group: publisher-news
  cancel-in-progress: false
jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python scripts/test_news.py
      - run: python scripts/test_news_delivery.py
      - run: python scripts/audit_news.py --self-test
      - run: python scripts/test_macro.py
      - run: node js/home.test.cjs
      - run: node js/copy.test.cjs
      - run: node js/security.test.cjs
      - run: node js/news-region.test.cjs
      - run: node js/news-reader.test.cjs
      - run: node js/news-loading.test.cjs
      - run: node js/news-auth.test.cjs
      - run: node js/news-select.test.cjs
      - run: node js/discipline.test.cjs
      - run: node js/fed.test.cjs
      - run: python scripts/update_news.py
      - run: python scripts/update_bi.py
      - run: python scripts/update_macro.py
      - name: Publish headlines
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add berita.json bi.json kalender.json fomc.json
          if ! git diff --cached --quiet; then
            git commit -m 'Refresh publisher headlines'
            git pull --rebase origin main
            git push origin HEAD:main
          fi
      - run: python scripts/build_news.py
      - name: Prepare website
        run: |
          mkdir _site
          cp index.html berita.json kalender.json bi.json fomc.json regional-sources.json _site/
          cp -r css js _site/
          mkdir _site/news
          cp news/index.json _site/news/
          cp -r news/sources news/archive news/categories _site/news/
          for route in home journal statistics calculator economic-news economic-news/calendar economic-news/social login profile; do
            mkdir -p "_site/$route"
            cp index.html "_site/$route/index.html"
          done
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - name: Deploy website
        id: deployment
        uses: actions/deploy-pages@v4
