name: Update publisher news
on:
  schedule:
    # Every 10 minutes — news, BI rates, calendar, FOMC
    - cron: '*/10 * * * *'
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'scripts/update_news.py'
      - 'scripts/update_bi.py'
      - 'scripts/update_macro.py'
      - 'scripts/build_news.py'
      - '.github/workflows/update-news.yml'
permissions:
  contents: write
concurrency:
  group: publisher-news
  cancel-in-progress: false
jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Update publisher news
        run: python scripts/update_news.py
      - name: Update BI rates
        run: python scripts/update_bi.py
      - name: Update macro / calendar
        run: python scripts/update_macro.py

      - name: Publish feed JSON to main
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add berita.json bi.json kalender.json fomc.json news/images || true
          if ! git diff --cached --quiet; then
            git commit -m 'Refresh publisher headlines'
            git pull --rebase origin main
            git push origin HEAD:main
          else
            echo 'No feed changes'
          fi
