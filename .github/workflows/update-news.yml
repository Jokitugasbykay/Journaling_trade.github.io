name: Update publisher news
on:
  schedule:
    - cron: '17,47 * * * *'
  workflow_dispatch:
  push:
    branches: [main]
permissions:
  contents: write
  pages: write
  id-token: write
concurrency:
  group: publisher-news
  cancel-in-progress: false
jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python scripts/test_news.py
      - run: node js/copy.test.cjs
      - run: python scripts/update_news.py
      - run: python scripts/update_bi.py
      - name: Publish headlines
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add berita.json bi.json
          if ! git diff --cached --quiet; then
            git commit -m 'Refresh publisher headlines'
            git pull --rebase origin main
            git push origin HEAD:main
          fi
      - name: Prepare website
        run: |
          mkdir _site
          cp index.html berita.json kalender.json bi.json _site/
          cp -r css js _site/
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - name: Deploy website
        id: deployment
        uses: actions/deploy-pages@v4
