name: Fix DXY feed

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/fix-dxy-feed.yml'
      - 'scripts/fix_dxy_feed.py'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Patch pro.js
        run: python3 scripts/fix_dxy_feed.py

      - name: Commit
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add js/pro.js
          git diff --cached --quiet && exit 0
          git commit -m "fix(market): DXY feed via majors approx (stop USD/EUR scale break)"
          git push
