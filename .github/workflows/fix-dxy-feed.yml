name: Fix DXY feed

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/fix-dxy-feed.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Patch pro.js DXY handling
        run: |
          python3 << 'PY'
          from pathlib import Path
          p = Path('js/pro.js')
          t = p.read_text(encoding='utf-8')

          # 1) Correct instrument definition comment-level: keep CC fields but mark as synthetic
          old_inst = "{ code: 'DXY', name: 'US Dollar Index Context', cat: 'INDICES', provider: 'CC', fsym: 'USD', tsym: 'EUR', tvSym: 'TVC:DXY', ccy: ['USD', 'EUR'] },"
          new_inst = "{ code: 'DXY', name: 'US Dollar Index Context', cat: 'INDICES', provider: 'DXY', fsym: 'USD', tsym: 'EUR', tvSym: 'TVC:DXY', ccy: ['USD', 'EUR'] },"
          if old_inst not in t:
              raise SystemExit('DXY instrument line not found')
          t = t.replace(old_inst, new_inst, 1)

          # 2) Insert helper functions before fetchForexOrMetalCC
          marker = '  async function fetchForexOrMetalCC(fsym, tsym, tf, limit = 500, signal = null) {'
          if marker not in t:
              raise SystemExit('fetchForexOrMetalCC marker missing')
          if 'async function fetchApproxDXYPrice' not in t:
              helpers = r'''
  /** Approximate ICE DXY from major FX (CORS-friendly). Not 1:1 with futures print. */
  async function fetchApproxDXYPrice(signal = null) {
    try {
      const res = await fetch('https://open.er-api.com/v6/latest/USD', { signal: signal || undefined });
      if (!res.ok) return null;
      const data = await res.json();
      const r = data.rates || {};
      const eurusd = r.EUR ? (1 / Number(r.EUR)) : NaN;
      const usdjpy = Number(r.JPY);
      const gbpusd = r.GBP ? (1 / Number(r.GBP)) : NaN;
      const usdcad = Number(r.CAD);
      const usdsek = Number(r.SEK);
      const usdchf = Number(r.CHF);
      if (![eurusd, usdjpy, gbpusd, usdcad, usdsek, usdchf].every((x) => Number.isFinite(x) && x > 0)) return null;
      const dxy = 50.14348112
        * Math.pow(eurusd, -0.576)
        * Math.pow(usdjpy, 0.136)
        * Math.pow(gbpusd, -0.119)
        * Math.pow(usdcad, 0.091)
        * Math.pow(usdsek, 0.042)
        * Math.pow(usdchf, 0.036);
      return +dxy.toFixed(3);
    } catch (_) {
      return null;
    }
  }

  async function fetchDXYCandles(tf, limit = 500, signal = null) {
    const stepSec = tfToSeconds(tf);
    const live = await fetchApproxDXYPrice(signal);
    const base = (live && live > 50 && live < 200) ? live : (SEED_PRICES.DXY || 104.2);
    // Synthetic series anchored to live approx DXY (CryptoCompare no longer public without key).
    return generateFallbackCandles(base, Math.min(limit, 500), stepSec);
  }

  function startDxyLiveTicker() {
    activeFeedInfo.textContent = 'Feed: DXY Approx (majors basket · 16:9)';
    const feedLabel = document.getElementById('feedSourceLabel');
    if (feedLabel) {
      feedLabel.innerHTML = '<svg xmlns="http://www.w3.org/2000/svg" width="11" height="11" viewBox="0 0 24 24" fill="currentColor" style="vertical-align:-1px;margin-right:3px"><path d="M13 2L3 14h9l-1 8 10-12h-9l1-8z"/></svg> STREAM: DXY APPROX (MAJORS)';
    }
    pollInterval = setInterval(async () => {
      try {
        const livePrice = await fetchApproxDXYPrice();
        if (!livePrice || currentCandles.length === 0) return;
        // Guard: never collapse DXY scale with FX cross prices (~0.9)
        if (livePrice < 50 || livePrice > 200) return;
        const last = { ...currentCandles[currentCandles.length - 1] };
        last.close = livePrice;
        if (livePrice > last.high) last.high = livePrice;
        if (livePrice < last.low) last.low = livePrice;
        currentCandles[currentCandles.length - 1] = last;
        if (candleSeries) candleSeries.update(last);
        updateLiveHeader(last);
        evaluateKaystradeEngine(false);
      } catch (_) {}
    }, 5000);
  }

'''
              t = t.replace(marker, helpers + marker, 1)

          # 3) In switchSymbolOrTF CC branch, special-case DXY before generic CC
          # Find the block that starts Forex/Spot feed for non-BINANCE
          needle = "activeFeedInfo.textContent = 'Feed: Forex/Spot (" + fsym + '/' + tsym + ' · 500 Bars · 16:9)';"
          # Use a more reliable unique nearby string
          unique = "const fsym = currentPairObj.fsym || 'USD';\n          const tsym = currentPairObj.tsym || 'EUR';"
          if unique not in t:
              # try alternate spacing
              import re
              m = re.search(r"const fsym = currentPairObj\.fsym[^\n]+\n\s*const tsym = currentPairObj\.tsym[^\n]+", t)
              if not m:
                  raise SystemExit('fsym/tsym block not found')
              unique = m.group(0)

          if 'currentPairObj.code === \'DXY\'' not in t and 'currentPairObj.provider === \'DXY\'' not in t:
              insert = unique + "\n\n          if (currentPairObj.code === 'DXY' || currentPairObj.provider === 'DXY') {\n            activeFeedInfo.textContent = 'Feed: DXY Approx (majors basket · 500 Bars · 16:9)';\n            const [activeData, h1Data, h4Data, d1Data] = await Promise.all([\n              fetchDXYCandles(selectedFrame, 500, controller.signal),\n              fetchDXYCandles('1h', 500, controller.signal),\n              fetchDXYCandles('4h', 500, controller.signal),\n              fetchDXYCandles('1d', 500, controller.signal)\n            ]);\n            applyLoadedCandles(activeData, h1Data, h4Data, d1Data);\n            startDxyLiveTicker();\n          } else {"
              # Wrap the rest is complex; instead replace startForexLiveTicker call site for DXY
              pass

          # Safer: replace startForexLiveTicker(fsym, tsym) when pair is DXY by patching the CC branch entry
          old_cc_start = """        } else {
          const fsym = currentPairObj.fsym || 'USD';
          const tsym = currentPairObj.tsym || 'EUR';
          activeFeedInfo.textContent = 'Feed: Forex/Spot (' + fsym + '/' + tsym + ' · 500 Bars · 16:9)';"""
          new_cc_start = """        } else if (currentPairObj.code === 'DXY' || currentPairObj.provider === 'DXY') {
          activeFeedInfo.textContent = 'Feed: DXY Approx (majors basket · 500 Bars · 16:9)';
          const [activeData, h1Data, h4Data, d1Data] = await Promise.all([
            fetchDXYCandles(selectedFrame, 500, controller.signal),
            fetchDXYCandles('1h', 500, controller.signal),
            fetchDXYCandles('4h', 500, controller.signal),
            fetchDXYCandles('1d', 500, controller.signal)
          ]);
          applyLoadedCandles(activeData, h1Data, h4Data, d1Data);
          startDxyLiveTicker();
        } else {
          const fsym = currentPairObj.fsym || 'USD';
          const tsym = currentPairObj.tsym || 'EUR';
          activeFeedInfo.textContent = 'Feed: Forex/Spot (' + fsym + '/' + tsym + ' · 500 Bars · 16:9)';"""

          if old_cc_start not in t:
              # looser match
              import re
              pat = r"\} else \{\s*const fsym = currentPairObj\.fsym \|\| 'USD';\s*const tsym = currentPairObj\.tsym \|\| 'EUR';\s*activeFeedInfo\.textContent = 'Feed: Forex/Spot '\s*\+\s*fsym\s*\+\s*'/'\s*\+\s*tsym\s*\+\s*' · 500 Bars · 16:9';"
              m = re.search(pat, t)
              if not m:
                  # print context for debugging
                  idx = t.find("Feed: Forex/Spot")
                  print('context', repr(t[idx-120:idx+180]) if idx>=0 else 'no forex spot')
                  raise SystemExit('CC branch start not found')
              t = t[:m.start()] + new_cc_start + t[m.end():]
          else:
              t = t.replace(old_cc_start, new_cc_start, 1)

          p.write_text(t, encoding='utf-8')
          print('pro.js size', p.stat().st_size)
          assert "fetchApproxDXYPrice" in t
          assert "startDxyLiveTicker" in t
          assert "provider: 'DXY'" in t
          print('ok')
          PY

      - name: Commit
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add js/pro.js
          git diff --cached --quiet && exit 0
          git commit -m "fix(market): DXY feed via majors approx (stop USD/EUR scale break)"
          git push
