name: SPA 404 fallback

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/spa-404-fallback.yml'
      - 'scripts/spa_404_fallback.py'
      - 'index.html'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fallback:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Create 404.html and route stubs
        run: python3 scripts/spa_404_fallback.py

      - name: Commit
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git status
          git diff --cached --quiet && exit 0
          git commit -m "fix(pages): SPA 404.html + route stubs so /home and deep links work"
          git push
