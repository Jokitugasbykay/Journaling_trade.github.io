name: SPA 404 fallback

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/spa-404-fallback.yml'
      - 'index.html'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fallback:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Create 404.html + route stubs
        run: |
          set -e
          python3 << 'PY'
          from pathlib import Path
          import shutil

          root = Path('.')
          index = root / 'index.html'
          if not index.exists():
              raise SystemExit('index.html missing')

          # GitHub Pages serves 404.html for missing paths — must be full SPA shell
          shutil.copyfile(index, root / '404.html')
          print('wrote 404.html', (root / '404.html').stat().st_size)

          # Physical stubs so /home/ etc. resolve even before 404 handling
          routes = [
              'home', 'journal', 'statistics', 'calculator',
              'economic-news', 'economic-news/calendar',
              'profile', 'login', 'pro',
              'analytics', 'heatmap', 'strategies', 'risk', 'reviews', 'reports', 'ai', 'global-news',
          ]
          stub = '''<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta http-equiv="refresh" content="0;url=../">
  <script>
    // Preserve deep path for SPA restoreRoute via full index shell
    // Prefer loading root index.html while keeping the URL path.
    (function () {
      var path = location.pathname;
      // Find repo root (…/Journaling_trade.github.io/)
      var parts = path.split('/').filter(Boolean);
      var idx = parts.indexOf('Journaling_trade.github.io');
      var base = idx >= 0 ? '/' + parts.slice(0, idx + 1).join('/') + '/' : '/';
      // Fetch is not needed — navigate to base index while keeping path via history is impossible
      // before load; instead redirect to same path served by 404/index.
      // For stub folders, point relative assets correctly by redirecting to root with hash marker.
      location.replace(base + path.slice(base.length).replace(/^\\/+/, '') + location.search + location.hash);
    })();
  </script>
  <title>Redirecting…</title>
</head>
<body>
  <p>Loading…</p>
</body>
</html>
'''
          # Better stub: copy full index into each route so direct load works offline of 404
          for route in routes:
              dest = root / route / 'index.html'
              dest.parent.mkdir(parents=True, exist_ok=True)
              shutil.copyfile(index, dest)
              print('stub', dest)
          print('done')
          PY

      - name: Commit
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add 404.html home journal statistics calculator economic-news profile login pro analytics heatmap strategies risk reviews reports ai global-news 2>/dev/null || git add -A
          git status
          git diff --cached --quiet && exit 0
          git commit -m "fix(pages): SPA 404.html + route stubs so /home and deep links work"
          git push
