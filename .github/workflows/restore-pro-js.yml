name: Restore pro.js

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  restore:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Restore pro.js from good commit
        run: |
          set -e
          git checkout 574a07a4626abb9f8598dce9c47910202d8c17f5 -- js/pro.js
          echo "restored size: $(wc -c < js/pro.js)"
          test $(wc -c < js/pro.js) -gt 100000

      - name: Apply entryTime date fix
        run: |
          set -e
          python3 <<'PY'
          from pathlib import Path
          p = Path("js/pro.js")
          t = p.read_text()
          needle = "const d = new Date(iso);"
          if needle not in t:
              raise SystemExit("expected fmtTime pattern not found")
          t2 = t.replace(
              "const fmtTime = (iso) => {",
              "const fmtTime = (ts) => {",
              1,
          )
          t2 = t2.replace(
              """      const fmtTime = (ts) => {
        if (!iso) return '-';
        try {
          const d = new Date(iso);
          if (isNaN(d.getTime())) return iso;
          return d.toLocaleDateString('id-ID', { day: '2-digit', month: 'short', year: 'numeric' }) + ' ' +
                 d.toLocaleTimeString('id-ID', { hour: '2-digit', minute: '2-digit' }).replace(':', '.');
        } catch (e) {
          return iso;
        }
      };""",
              """      const fmtTime = (ts) => {
        if (ts === null || ts === undefined || ts === '') return '-';
        try {
          const n = Number(ts);
          const d = (typeof ts === 'string' && Number.isNaN(n))
            ? new Date(ts)
            : new Date(n > 0 && n < 1e12 ? n * 1000 : n);
          if (isNaN(d.getTime())) return String(ts);
          return d.toLocaleDateString('id-ID', { day: '2-digit', month: 'short', year: 'numeric' }) + ' ' +
                 d.toLocaleTimeString('id-ID', { hour: '2-digit', minute: '2-digit' }).replace(':', '.');
        } catch (e) {
          return String(ts);
        }
      };""",
              1,
          )
          if t2 == t:
              raise SystemExit("fmtTime replace failed")
          p.write_text(t2)
          print("fixed size", p.stat().st_size)
          PY

      - name: Cleanup chunk files and commit
        run: |
          set -e
          rm -f js/pro.chunk.*.js || true
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git status
          git commit -m "fix: restore full pro.js + fix backtest entryTime dates" || echo "nothing to commit"
          git push origin HEAD:main
