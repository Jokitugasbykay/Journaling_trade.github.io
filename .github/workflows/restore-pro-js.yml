name: Restore pro.js

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/restore-pro-js.yml'

permissions:
  contents: write

jobs:
  restore:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Restore pro.js from good commit
        run: |
          git checkout 574a07a4626abb9f8598dce9c47910202d8c17f5 -- js/pro.js
          wc -c js/pro.js
          head -c 40 js/pro.js
          echo

      - name: Apply entryTime date fix
        run: |
          python3 << 'PY'
          from pathlib import Path
          p = Path('js/pro.js')
          t = p.read_text()
          old = """      const fmtTime = (iso) => {
        if (!iso) return '-';
        try {
          const d = new Date(iso);
          if (isNaN(d.getTime())) return iso;
          return d.toLocaleDateString('id-ID', { day: '2-digit', month: 'short', year: 'numeric' }) + ' ' +
                 d.toLocaleTimeString('id-ID', { hour: '2-digit', minute: '2-digit' }).replace(':', '.');
        } catch (e) {
          return iso;
        }
      };"""
          new = """      const fmtTime = (ts) => {
        if (ts === null || ts === undefined || ts === '') return '-';
        try {
          const n = Number(ts);
          // Engine stores Unix seconds; Date(number) expects milliseconds.
          const d = (typeof ts === 'string' && Number.isNaN(n))
            ? new Date(ts)
            : new Date(n > 0 && n < 1e12 ? n * 1000 : n);
          if (isNaN(d.getTime())) return String(ts);
          return d.toLocaleDateString('id-ID', { day: '2-digit', month: 'short', year: 'numeric' }) + ' ' +
                 d.toLocaleTimeString('id-ID', { hour: '2-digit', minute: '2-digit' }).replace(':', '.');
        } catch (e) {
          return String(ts);
        }
      };"""
          if old not in t:
            raise SystemExit('fmtTime block not found')
          p.write_text(t.replace(old, new, 1))
          print('date fix applied', p.stat().st_size)
          PY

      - name: Remove broken chunk leftovers
        run: |
          rm -f js/pro.chunk.*.js || true

      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add js/pro.js
          git add -u js/pro.chunk.*.js 2>/dev/null || true
          git status
          git commit -m "fix: restore full pro.js + fix backtest entryTime (Unix seconds -> not 1970)" || echo "no changes"
          git push origin HEAD:main
